org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Resolve dependency downloads over IPv4.
#
# The build pulls from Google Maven, Maven Central and the Gradle plugin portal.
# On hosts whose DNS answers with AAAA records but whose IPv6 route is dead —
# GitHub Actions runners in some regions, and most Android-on-ARM dev boxes —
# the JVM picks the IPv6 address and the download stalls until it times out,
# with an error that names neither the cause nor the fix.
#
# `preferIPv4Stack` keeps the socket stack IPv4-only; `preferIPv4Addresses`
# makes the resolver drop the AAAA records entirely, which is the part that
# actually stops the stall. Both only affect the build JVM — the app's own
# networking at runtime is unaffected, and the engine is reached over
# 127.0.0.1 (IPv4) anyway, see core/engine/.../ProcessManager.kt.
systemProp.java.net.preferIPv4Stack=true
systemProp.java.net.preferIPv4Addresses=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official

# Version catalog: the single source of truth for plugin and library
# versions (Opsi C batch 3). Previously every version was hardcoded in
# each build.gradle.kts, so the same library drifted between modules
# (and nothing made that visible). Bump a version here and every module
# follows; CI proves the build still passes.
[versions]
agp = "8.7.3"
kotlin = "2.1.0"
coroutines = "1.9.0"
serialization = "1.7.3"
composeBom = "2024.12.01"
# The Android SDK levels and the Java version live here too (62-F10): the
# five module build files used to repeat `compileSdk = 35`, `minSdk = 29`
# and Java 17 as literals, so one module could drift without anyone
# noticing. Bump a value here and every module follows.
compileSdk = "35"
minSdk = "29"
targetSdk = "35"
java = "17"
activityCompose = "1.9.3"
biometric = "1.1.0"
fragmentKtx = "1.8.2"
# lifecycle 2.8.7: the Dec-2024 contemporary of composeBom 2024.12.01
# (63-F5). 2.8.3 predated the BOM set and risked a NoSuchMethodError on a
# Compose code path calling a newer lifecycle API.
lifecycle = "2.8.7"
# OkHttp 4.12.1: one patch above 4.12.0 for CVE-2026-111943 (leaked-CA
# blocklist, 63-F4). The app's own traffic is loopback-only, so the risk was
# latent — but a future HTTPS caller would have inherited the hole.
okhttp = "4.12.1"
junit = "4.13.2"
json = "20240303"

[libraries]
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragmentKtx" }
material3-window-size = { module = "androidx.compose.material3:material3-window-size-class" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The wrapper jar is executable content pulled from a distribution URL. If it
      # were swapped, every build below would run attacker-chosen code.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest already ships an Android SDK, so setup-android is not needed —
      # and v3 is broken anyway: it installs the obsolete `tools` package, which the
      # current repository no longer publishes.
      - name: Install required SDK packages
        run: |
          sdkmanager="$(command -v sdkmanager || echo "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tr ' ' '\n' | head -1)"
          echo "using $sdkmanager"
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" "build-tools;35.0.0" | tail -2

      - name: Unit tests
        working-directory: android
        run: ./gradlew test --no-daemon

      # Builds, but the APK is NOT a release artifact: app/src/main/jniLibs is
      # gitignored, so a fresh clone has no engine, git, or ripgrep binary. Those are
      # 217 MB of staged output and belong in a release, not in git. Packaging here
      # still catches resource, manifest, and R8 regressions.
      - name: Compile and package (engine absent by design)
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: opencode-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload debug APK to rolling release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: debug-latest
          name: Debug build (latest)
          prerelease: true
          make_latest: false
          overwrite_files: true
          generate_release_notes: false
          body: |
            Automated debug APK from CI (no bundled engine/git/rg binaries).
            Commit: ${{ github.sha }}
          files: |
            android/app/build/outputs/apk/debug/*.apk

      - name: Fail if the engine binary ever lands in git
        run: |
          if git ls-files | grep -qE 'jniLibs/.*\.so$'; then
            echo "A staged native binary was committed. libopencode.so is ~217 MB" \
                 "and must stay out of git — it is produced by stage-engine.ps1." >&2
            exit 1
          fi

      # GPLv2: git is built from upstream sources and shipped in the APK, so each
      # release must carry the matching source tarball. This does not attach it —
      # it proves the version the build script downloads is pinned and reachable.
      - name: Check the git source tarball is fetchable
        run: |
          version=$(sed -n 's/^\$GitVersion = "\([0-9.]*\)".*/\1/p' script/android/build-tools.ps1)
          test -n "$version" || { echo "Could not read GitVersion from build-tools.ps1" >&2; exit 1; }
          url="https://mirrors.edge.kernel.org/pub/software/scm/git/git-$version.tar.gz"
          curl --fail --silent --head --output /dev/null "$url"
          echo "release must attach: git-$version.tar.gz"

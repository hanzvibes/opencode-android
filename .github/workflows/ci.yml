name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One build per ref. A second push to the same branch cancels the first, so a
# force-push does not leave two runners downloading 200 MB of APKs each.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The wrapper jar is executable content pulled from a distribution URL. If it
      # were swapped, every build below would run attacker-chosen code.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest already ships an Android SDK, so setup-android is not needed —
      # and v3 is broken anyway: it installs the obsolete `tools` package, which the
      # current repository no longer publishes.
      - name: Install required SDK packages
        run: |
          sdkmanager="$(command -v sdkmanager || echo "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tr ' ' '\n' | head -1)"
          echo "using $sdkmanager"
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" | tail -2
          # AGP still resolves build-tools 34.0.0 for the unit-test tasks even
          # though compileSdk is 35; without it the test step fails with
          # "Failed to install build-tools;34.0.0 ... licences have not been
          # accepted" on a clean SDK.

      # Dependency resolution is forced onto IPv4 by android/gradle.properties.
      # The runner's DNS answers with AAAA records it cannot actually route to,
      # and the resulting stall used to look like an unrelated build timeout.
      - name: Unit tests
        working-directory: android
        run: ./gradlew test --no-daemon

      # Opsi C: lint runs on every PR/push so new warnings cannot pile up
      # silently. It fails only on errors (the AGP default); warnings are
      # reported in the log.
      - name: Lint
        working-directory: android
        run: ./gradlew lint --no-daemon

      # The engine ships as a native library inside the upstream release APKs.
      # This is the only step that pulls executable content off the internet, so
      # the bytes are pinned: the digests below are GitHub's own release-asset
      # digests, and the step aborts if a single byte differs. Re-derive them
      # from the GitHub API (`assets[].digest`) whenever the upstream tag moves.
      - name: Stage native engine binaries from upstream release
        env:
          UPSTREAM_TAG: v0.1.1
          ARM64_SHA256: d330c1bd87be41dd3d1edebb73414bdce31dc96d26d54e64bb2887796f53af52
          X86_64_SHA256: 9c60f84fb8fbde85b4d3d9a651cbeef2b16827a9784718d784c5f536266579d9
        run: |
          set -euo pipefail

          base="https://github.com/BIDZZ-RAWR/OPENCODE-ANDROID/releases/download/$UPSTREAM_TAG"
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT

          download() { # $1=abi  $2=expected sha256
            local abi="$1"
            local expected="$2"
            local apk="$tmpdir/$1.apk"
            echo "Downloading $abi release APK..."
            curl -f -sL --retry 3 --retry-delay 2 -4 "$base/app-$abi-release.apk" -o "$apk"
            echo "$expected  $apk" | sha256sum --check --strict -
          }

          download arm64-v8a "$ARM64_SHA256"
          download x86_64 "$X86_64_SHA256"

          echo "Extracting native libraries..."
          for abi in arm64-v8a x86_64; do
            dest="android/app/src/main/jniLibs/$abi"
            mkdir -p "$dest"
            unzip -q -j "$tmpdir/$abi.apk" "lib/$abi/*" -d "$dest/"
          done

          # An APK with a truncated or wrong-architecture engine installs fine and
          # then fails at exec time with a bare "Permission denied", which is
          # miserable to diagnose on a device. Fail here instead.
          check_elf() { # $1=file  $2=expected e_machine (little-endian hex)
            local file="$1" expected="$2" magic machine
            magic=$(od -An -tx1 -N4 "$file" | tr -d ' \n')
            machine=$(od -An -tx1 -j18 -N2 "$file" | tr -d ' \n')
            if [ "$magic" != "7f454c46" ]; then
              echo "not an ELF file: $file" >&2
              exit 1
            fi
            if [ "$machine" != "$expected" ]; then
              echo "architecture mismatch: $file reports e_machine=0x$machine, expected 0x$expected" >&2
              exit 1
            fi
          }

          for abi in arm64-v8a x86_64; do
            dest="android/app/src/main/jniLibs/$abi"
            case "$abi" in
              arm64-v8a) expected=b700 ;;
              x86_64)    expected=3e00 ;;
            esac

            engine="$dest/libopencode.so"
            if [ ! -f "$engine" ]; then
              echo "the engine library is missing from the $abi APK: $engine" >&2
              exit 1
            fi
            # A stub engine would be tens of kilobytes; the real one is ~200 MB.
            size_mb=$(( $(wc -c < "$engine") / 1048576 ))
            if [ "$size_mb" -lt 50 ]; then
              echo "$engine is only ${size_mb} MB — the APK does not contain the engine" >&2
              exit 1
            fi
            check_elf "$engine" "$expected"

            for tool in git rg; do
              lib="$dest/lib$tool.so"
              if [ -f "$lib" ]; then
                check_elf "$lib" "$expected"
              else
                echo "note: $lib is absent — git and ripgrep will be missing from the $abi APK" >&2
              fi
            done

            echo "$abi staged: $(ls -1 "$dest" | tr '\n' ' ')"
          done

      # Node.js ships as Termux native libraries, staged from .deb files by
      # script/android/stage-node.sh (pinned versions + SHA256, patchelf
      # renames, ELF gates). This is option (a) from the fix list: the
      # upstream release APK cannot be updated by us, so CI stages Node
      # itself. The script fails loudly if a library is missing or fails a
      # gate — a missing libnode.so must never be a silent "note" like the
      # git/rg check above. It also stages the npm tree + CA bundle into
      # assets/node/ (extracted to files/engine/node/ at first launch).
      - name: Stage Node.js from Termux
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf
          bash script/android/stage-node.sh --abi arm64-v8a \
            --jni-out android/app/src/main/jniLibs/arm64-v8a \
            --assets-out android/app/src/main/assets/node
          bash script/android/stage-node.sh --abi x86_64 \
            --jni-out android/app/src/main/jniLibs/x86_64 \
            --no-assets
          echo "arm64-v8a staged: $(ls -1 android/app/src/main/jniLibs/arm64-v8a | tr '\n' ' ')"
          echo "x86_64 staged: $(ls -1 android/app/src/main/jniLibs/x86_64 | tr '\n' ' ')"

      # xz / tar / ar ship as Termux native libraries, staged from .deb
      # files by script/android/stage-xz.sh (same pattern as Node above:
      # pinned versions + SHA256, patchelf renames, ELF gates). The script
      # fails loudly on a missing lib or a failed gate.
      - name: Stage xz/tar/ar from Termux
        run: |
          set -euo pipefail
          bash script/android/stage-xz.sh --abi arm64-v8a \
            --jni-out android/app/src/main/jniLibs/arm64-v8a
          bash script/android/stage-xz.sh --abi x86_64 \
            --jni-out android/app/src/main/jniLibs/x86_64
          echo "arm64-v8a staged: $(ls -1 android/app/src/main/jniLibs/arm64-v8a | tr '\n' ' ')"
          echo "x86_64 staged: $(ls -1 android/app/src/main/jniLibs/x86_64 | tr '\n' ' ')"

      - name: Compile and package
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      # Opsi C: the release artifact (R8 + shrinkResources) must build too —
      # debug-only CI hid release-only failures.
      - name: Compile release artifact
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload debug APK to rolling release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: debug-latest
          name: OpenCode Android (Latest with Engine)
          prerelease: true
          make_latest: false
          overwrite_files: true
          generate_release_notes: false
          body: |
            Automated build with PrivateLM UI & bundled OpenCode engine binaries (arm64-v8a & x86_64).
            Commit: ${{ github.sha }}
          files: |
            android/app/build/outputs/apk/debug/*.apk

      - name: Fail if the engine binary ever lands in git
        run: |
          if git ls-files | grep -qE 'jniLibs/.*\.so$'; then
            echo "A staged native binary was committed to git." >&2
            exit 1
          fi

      # GPLv2: git is built from upstream sources and shipped in the APK, so each
      # release must carry the matching source tarball. This does not attach it —
      # it proves the version the build script downloads is pinned and reachable.
      - name: Check the git source tarball is fetchable
        run: |
          version=$(sed -n 's/^\$GitVersion = "\([0-9.]*\)".*/\1/p' script/android/build-tools.ps1)
          test -n "$version" || { echo "Could not read GitVersion from build-tools.ps1" >&2; exit 1; }
          url="https://mirrors.edge.kernel.org/pub/software/scm/git/git-$version.tar.gz"
          curl --fail --silent --head --output /dev/null "$url"
          echo "release must attach: git-$version.tar.gz"

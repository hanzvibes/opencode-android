name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One build per ref. A second push to the same branch cancels the first, so a
# force-push does not leave two runners downloading 200 MB of APKs each.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 — the build derives versionCode from `git rev-list --count HEAD`
      # (audit-100 Fase 4, 84-F3); a shallow checkout would report 1 for every build.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Guard FIRST (audit-100 Fase 4, 62-F6): it used to run after the upload, so a
      # committed native binary was already published by the time the job failed.
      - name: Fail if the engine binary ever lands in git
        run: |
          if git ls-files | grep -qE 'jniLibs/.*\.so$'; then
            echo "A staged native binary was committed to git." >&2
            exit 1
          fi

      # The wrapper jar is executable content pulled from a distribution URL. If it
      # were swapped, every build below would run attacker-chosen code.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest already ships an Android SDK, so setup-android is not needed —
      # and v3 is broken anyway: it installs the obsolete `tools` package, which the
      # current repository no longer publishes.
      - name: Install required SDK packages
        run: |
          sdkmanager="$(command -v sdkmanager || echo "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tr ' ' '\n' | head -1)"
          echo "using $sdkmanager"
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0" | tail -2
          # AGP still resolves build-tools 34.0.0 for the unit-test tasks even
          # though compileSdk is 35; without it the test step fails with
          # "Failed to install build-tools;34.0.0 ... licences have not been
          # accepted" on a clean SDK.

      # Dependency resolution is forced onto IPv4 by android/gradle.properties.
      # The runner's DNS answers with AAAA records it cannot actually route to,
      # and the resulting stall used to look like an unrelated build timeout.
      - name: Unit tests
        working-directory: android
        run: ./gradlew test --no-daemon

      # Opsi C: lint runs on every PR/push so new warnings cannot pile up
      # silently. It fails only on errors (the AGP default); warnings are
      # reported in the log.
      - name: Lint
        working-directory: android
        run: ./gradlew lint --no-daemon

      # The engine ships as a native library inside the upstream release APKs.
      # This is the only step that pulls executable content off the internet, so
      # the bytes are pinned: the digests below are GitHub's own release-asset
      # digests, and the step aborts if a single byte differs. Re-derive them
      # from the GitHub API (`assets[].digest`) whenever the upstream tag moves.
      - name: Stage native engine binaries from upstream release
        env:
          UPSTREAM_TAG: v0.1.1
          ARM64_SHA256: d330c1bd87be41dd3d1edebb73414bdce31dc96d26d54e64bb2887796f53af52
          X86_64_SHA256: 9c60f84fb8fbde85b4d3d9a651cbeef2b16827a9784718d784c5f536266579d9
        run: |
          set -euo pipefail

          base="https://github.com/BIDZZ-RAWR/OPENCODE-ANDROID/releases/download/$UPSTREAM_TAG"
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT

          download() { # $1=abi  $2=expected sha256
            local abi="$1"
            local expected="$2"
            local apk="$tmpdir/$1.apk"
            echo "Downloading $abi release APK..."
            curl -f -sL --retry 3 --retry-delay 2 -4 "$base/app-$abi-release.apk" -o "$apk"
            echo "$expected  $apk" | sha256sum --check --strict -
          }

          download arm64-v8a "$ARM64_SHA256"
          download x86_64 "$X86_64_SHA256"

          echo "Extracting native libraries..."
          for abi in arm64-v8a x86_64; do
            dest="android/app/src/main/jniLibs/$abi"
            mkdir -p "$dest"
            unzip -q -j "$tmpdir/$abi.apk" "lib/$abi/*" -d "$dest/"
          done

          # An APK with a truncated or wrong-architecture engine installs fine and
          # then fails at exec time with a bare "Permission denied", which is
          # miserable to diagnose on a device. Fail here instead.
          check_elf() { # $1=file  $2=expected e_machine (little-endian hex)
            local file="$1" expected="$2" magic machine
            magic=$(od -An -tx1 -N4 "$file" | tr -d ' \n')
            machine=$(od -An -tx1 -j18 -N2 "$file" | tr -d ' \n')
            if [ "$magic" != "7f454c46" ]; then
              echo "not an ELF file: $file" >&2
              exit 1
            fi
            if [ "$machine" != "$expected" ]; then
              echo "architecture mismatch: $file reports e_machine=0x$machine, expected 0x$expected" >&2
              exit 1
            fi
          }

          for abi in arm64-v8a x86_64; do
            dest="android/app/src/main/jniLibs/$abi"
            case "$abi" in
              arm64-v8a) expected=b700 ;;
              x86_64)    expected=3e00 ;;
            esac

            engine="$dest/libopencode.so"
            if [ ! -f "$engine" ]; then
              echo "the engine library is missing from the $abi APK: $engine" >&2
              exit 1
            fi
            # A stub engine would be tens of kilobytes; the real one is ~200 MB.
            size_mb=$(( $(wc -c < "$engine") / 1048576 ))
            if [ "$size_mb" -lt 50 ]; then
              echo "$engine is only ${size_mb} MB — the APK does not contain the engine" >&2
              exit 1
            fi
            check_elf "$engine" "$expected"

            for tool in git rg; do
              lib="$dest/lib$tool.so"
              if [ -f "$lib" ]; then
                check_elf "$lib" "$expected"
              else
                echo "note: $lib is absent — git and ripgrep will be missing from the $abi APK" >&2
              fi
            done

            echo "$abi staged: $(ls -1 "$dest" | tr '\n' ' ')"
          done

      # Node.js ships as Termux native libraries, staged from .deb files by
      # script/android/stage-node.sh (pinned versions + SHA256, patchelf
      # renames, ELF gates). This is option (a) from the fix list: the
      # upstream release APK cannot be updated by us, so CI stages Node
      # itself. The script fails loudly if a library is missing or fails a
      # gate — a missing libnode.so must never be a silent "note" like the
      # git/rg check above. It also stages the npm tree + CA bundle into
      # assets/node/ (extracted to files/engine/node/ at first launch).
      - name: Stage Node.js from Termux
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf
          bash script/android/stage-node.sh --abi arm64-v8a \
            --jni-out android/app/src/main/jniLibs/arm64-v8a \
            --assets-out android/app/src/main/assets/node
          bash script/android/stage-node.sh --abi x86_64 \
            --jni-out android/app/src/main/jniLibs/x86_64 \
            --no-assets
          echo "arm64-v8a staged: $(ls -1 android/app/src/main/jniLibs/arm64-v8a | tr '\n' ' ')"
          echo "x86_64 staged: $(ls -1 android/app/src/main/jniLibs/x86_64 | tr '\n' ' ')"

      # xz / tar / ar ship as Termux native libraries, staged from .deb
      # files by script/android/stage-xz.sh (same pattern as Node above:
      # pinned versions + SHA256, patchelf renames, ELF gates). The script
      # fails loudly on a missing lib or a failed gate.
      - name: Stage xz/tar/ar from Termux
        run: |
          set -euo pipefail
          bash script/android/stage-xz.sh --abi arm64-v8a \
            --jni-out android/app/src/main/jniLibs/arm64-v8a
          bash script/android/stage-xz.sh --abi x86_64 \
            --jni-out android/app/src/main/jniLibs/x86_64
          echo "arm64-v8a staged: $(ls -1 android/app/src/main/jniLibs/arm64-v8a | tr '\n' ' ')"
          echo "x86_64 staged: $(ls -1 android/app/src/main/jniLibs/x86_64 | tr '\n' ' ')"

      # curl ships as a Termux native library, staged from .deb files by
      # script/android/stage-curl.sh (same pattern as Node/xz above:
      # pinned versions + SHA256, patchelf renames, ELF gates). The script
      # fails loudly on a missing lib or a failed gate.
      - name: Stage curl from Termux
        run: |
          set -euo pipefail
          bash script/android/stage-curl.sh --abi arm64-v8a \
            --jni-out android/app/src/main/jniLibs/arm64-v8a
          bash script/android/stage-curl.sh --abi x86_64 \
            --jni-out android/app/src/main/jniLibs/x86_64
          echo "arm64-v8a staged: $(ls -1 android/app/src/main/jniLibs/arm64-v8a | tr '\n' ' ')"
          echo "x86_64 staged: $(ls -1 android/app/src/main/jniLibs/x86_64 | tr '\n' ' ')"

      # python3 + pip ship as Termux native libraries, staged from .deb
      # files by script/android/stage-python.sh (same pattern as Node/xz/curl
      # above). It also stages the stdlib tree (+ pip) into assets/python/
      # (extracted to files/engine/python/ at first launch) and rewrites the
      # lib-dynload modules' versioned DT_NEEDED entries, which the ELF gate
      # over jniLibs cannot see. `pip` has no binary: it runs as
      # `python3 -m pip`.
      - name: Stage python3 + pip from Termux
        run: |
          set -euo pipefail
          bash script/android/stage-python.sh --abi arm64-v8a \
            --jni-out android/app/src/main/jniLibs/arm64-v8a \
            --assets-out android/app/src/main/assets/python
          bash script/android/stage-python.sh --abi x86_64 \
            --jni-out android/app/src/main/jniLibs/x86_64 \
            --no-assets
          echo "arm64-v8a staged: $(ls -1 android/app/src/main/jniLibs/arm64-v8a | tr '\n' ' ')"
          echo "x86_64 staged: $(ls -1 android/app/src/main/jniLibs/x86_64 | tr '\n' ' ')"

      # jq ships as a Termux native library, staged from .deb files by
      # script/android/stage-jq.sh (same pattern as curl above).
      - name: Stage jq from Termux
        run: |
          set -euo pipefail
          bash script/android/stage-jq.sh --abi arm64-v8a \
            --jni-out android/app/src/main/jniLibs/arm64-v8a
          bash script/android/stage-jq.sh --abi x86_64 \
            --jni-out android/app/src/main/jniLibs/x86_64
          echo "arm64-v8a staged: $(ls -1 android/app/src/main/jniLibs/arm64-v8a | tr '\n' ' ')"
          echo "x86_64 staged: $(ls -1 android/app/src/main/jniLibs/x86_64 | tr '\n' ' ')"

      # ffmpeg + ffprobe ship as Termux native libraries, staged from .deb
      # files by script/android/stage-ffmpeg.sh (same pattern as curl above).
      # The closure is large by construction (~89 MiB of libs: Termux's
      # ffmpeg links the full codec set, and every DT_NEEDED lib must be
      # present or even `ffmpeg -version` fails to load).
      - name: Stage ffmpeg + ffprobe from Termux
        run: |
          set -euo pipefail
          bash script/android/stage-ffmpeg.sh --abi arm64-v8a \
            --jni-out android/app/src/main/jniLibs/arm64-v8a
          bash script/android/stage-ffmpeg.sh --abi x86_64 \
            --jni-out android/app/src/main/jniLibs/x86_64
          echo "arm64-v8a staged: $(ls -1 android/app/src/main/jniLibs/arm64-v8a | tr '\n' ' ')"
          echo "x86_64 staged: $(ls -1 android/app/src/main/jniLibs/x86_64 | tr '\n' ' ')"

      # Language servers (TypeScript + Python) ship as pure-JS npm packages,
      # staged by script/android/stage-lsp.sh (pinned tarballs, SHA512, no
      # ABI). They run under the bundled Node; see engine/README.md for the
      # opencode.json snippet that points the engine at them.
      - name: Stage language servers from npm
        run: |
          set -euo pipefail
          bash script/android/stage-lsp.sh \
            --assets-out android/app/src/main/assets/lsp

      - name: Compile and package
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      # Release signing (audit-100 Fase 4, 84-F2/84-F4): when the maintainer has stored
      # the release keystore as secrets, restore it so assembleRelease produces a
      # signed, installable APK. Without the secrets the release stays unsigned —
      # the step says so loudly instead of failing or pretending otherwise.
      # Secrets needed (see docs/RELEASE_SIGNING.md): RELEASE_KEYSTORE_B64 (base64
      # of the .keystore), RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS,
      # RELEASE_KEY_PASSWORD.
      - name: Restore release keystore (if configured)
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE_B64" ]; then
            echo "No RELEASE_KEYSTORE_B64 secret — assembleRelease will be UNSIGNED (see docs/RELEASE_SIGNING.md)."
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > android/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF
          echo "Release keystore restored; assembleRelease will be signed."

      # Opsi C: the release artifact (R8 + shrinkResources) must build too —
      # debug-only CI hid release-only failures.
      - name: Compile release artifact
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      # The release APK is built on every run but used to be thrown away
      # (audit-100 Fase 4, 84-F11). Keep it as a workflow artifact so it can be
      # downloaded and tested; the signed-release channel below publishes it to
      # a GitHub release once a keystore secret exists.
      - name: Upload release APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # GPL: git (GPL-2.0), GNU tar and binutils (GPL-3.0) ship inside the APK, so
      # each release must carry their corresponding source (audit-100 Fase 4,
      # 62-F3/84-F5). Download the exact pinned tarballs, verify SHA-256, and fail
      # hard on any mismatch — the upload step below attaches them to the release.
      # Hashes are cross-checked against the publishers (kernel.org sha256sums.asc
      # for git; a second GNU mirror for tar/binutils) and recorded in
      # THIRD_PARTY_NOTICES.md.
      - name: Download and verify GPL source tarballs
        run: |
          set -euo pipefail
          mkdir -p gpl-sources
          cd gpl-sources
          curl -f -sL --retry 3 --retry-delay 2 -4 \
            -o git-2.56.0.tar.gz \
            https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.56.0.tar.gz
          curl -f -sL --retry 3 --retry-delay 2 -4 \
            -o tar-1.35.tar.gz \
            https://ftp.gnu.org/gnu/tar/tar-1.35.tar.gz
          curl -f -sL --retry 3 --retry-delay 2 -4 \
            -o binutils-2.47.tar.gz \
            https://ftp.gnu.org/gnu/binutils/binutils-2.47.tar.gz
          cat > SHA256SUMS <<'EOF'
          826817fd3671b8565586d6d49f688298de8354ab11db829c02720e5c74b9b39f  git-2.56.0.tar.gz
          14d55e32063ea9526e057fbf35fcabd53378e769787eff7919c3755b02d2b57e  tar-1.35.tar.gz
          15f5abd0db9cf8ea116f516a9ce12bc1cefef491ef9e50942868093d8f92a6f3  binutils-2.47.tar.gz
          EOF
          sha256sum --check --strict SHA256SUMS
          ls -la

      # The version the APKs actually carry (audit-100 Fase 4, 84-F3): versionCode
      # is the commit count on main, versionName is 0.1.1+<short SHA>. Gradle
      # computes the same values from git, so the release body and the APK agree.
      - name: Compute release version
        id: release-version
        run: |
          echo "version-code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "version-name=0.1.1+${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK to rolling release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: OpenCode Android (Latest with Engine)
          prerelease: true
          make_latest: false
          overwrite_files: true
          generate_release_notes: false
          body: |
            Automated build with PrivateLM UI & bundled OpenCode engine binaries (arm64-v8a & x86_64).
            Commit: ${{ github.sha }}
            Version: ${{ steps.release-version.outputs.version-name }} (code ${{ steps.release-version.outputs.version-code }})
            Debug APKs are signed with the shared debug key (docs/RELEASE_SIGNING.md), so they update in place.
            Corresponding Source for the GPL components in the APK is attached below (git, GNU tar, binutils); licence texts are in THIRD_PARTY_NOTICES.md and inside the APK at assets/licenses/.
          files: |
            android/app/build/outputs/apk/debug/*.apk
            gpl-sources/git-2.56.0.tar.gz
            gpl-sources/tar-1.35.tar.gz
            gpl-sources/binutils-2.47.tar.gz

      # A failed upload used to be hidden by `continue-on-error: true`
      # (audit-100 Fase 4, 84-F1/62-F1): the job stayed green while debug-latest
      # kept the old APK. The upload step now fails loudly, and this step proves
      # the release actually carries the APKs we just built, at the exact sizes.
      # (SHA-256 would need re-downloading ~500 MB of APKs; size + name catches
      # the realistic failures — empty glob, truncated upload, wrong file.)
      - name: Verify the rolling release carries the new APKs
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/${{ github.repository }}/releases/tags/debug-latest")
          for apk in android/app/build/outputs/apk/debug/*.apk; do
            name=$(basename "$apk")
            size=$(wc -c < "$apk")
            actual=$(echo "$release" | jq -r --arg n "$name" '.assets[] | select(.name == $n) | .size')
            if [ -z "$actual" ]; then
              echo "release asset $name is MISSING from debug-latest" >&2
              exit 1
            fi
            if [ "$actual" != "$size" ]; then
              echo "release asset $name has size $actual, expected $size (truncated upload?)" >&2
              exit 1
            fi
            echo "verified $name ($size bytes)"
          done

      # Signed release channel (audit-100 Fase 4, 84-F4): publishes the release APK
      # to `release-latest` once the maintainer stores the keystore secret. Until
      # then the step is skipped — visibly, in the Actions UI — and the release
      # APK is still kept as a workflow artifact above. The debug channel above
      # stays the default distribution until then; switching it would break
      # in-place updates (different signing key).
      - name: Note signed-release status
        env:
          HAS_RELEASE_KEY: ${{ secrets.RELEASE_KEYSTORE_B64 != '' }}
        run: |
          if [ "$HAS_RELEASE_KEY" != 'true' ]; then
            echo "No RELEASE_KEYSTORE_B64 secret: the signed release channel is disabled; the release APK is kept as a workflow artifact (see docs/RELEASE_SIGNING.md)."
          fi

      - name: Publish signed release APK
        if: github.event_name == 'push' && secrets.RELEASE_KEYSTORE_B64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-latest
          name: OpenCode Android (Release)
          prerelease: true
          make_latest: false
          overwrite_files: true
          generate_release_notes: false
          body: |
            Signed release build (R8 + shrinkResources, not debuggable).
            Commit: ${{ github.sha }}
            Version: ${{ steps.release-version.outputs.version-name }} (code ${{ steps.release-version.outputs.version-code }})
            Corresponding Source for the GPL components in the APK is attached to the debug-latest release; licence texts are in THIRD_PARTY_NOTICES.md and inside the APK at assets/licenses/.
          files: |
            android/app/build/outputs/apk/release/*.apk
